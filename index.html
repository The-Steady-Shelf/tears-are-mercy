:root{--ink:#262626;--soft:#4E4A44;--stone:#6F695F;--brass:#A8865A;--brasstext:#8A6A3E;--paper:#F6F3EE;--green:#2F4A40;--green2:#3F5F52;--line:#E3DACB;--card:#fff;--bg:#F6F3EE}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
header.top{background:var(--green);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 18px;position:relative;overflow:hidden}
header.top .pat{position:absolute;inset:0;opacity:.22}
header.top .in{position:relative;max-width:640px;margin:0 auto}
header.top .k{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#E2CFA9;font-weight:600}
header.top h1{font-family:'Cormorant',serif;font-weight:600;font-size:30px;line-height:1.1;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:18px 16px 24px}
h2{font-family:'Cormorant',serif;font-weight:600;font-size:26px;color:var(--green);line-height:1.15;margin:6px 0 4px}
h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--brasstext);font-weight:600;margin:22px 0 8px}
.lede{font-family:'Lora',serif;font-style:italic;color:var(--soft);font-size:15px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px;margin-bottom:12px}
.card.tint{background:#FBF8F2}
.card.green{background:var(--green);color:#fff;border-color:var(--green)}
.card.green .lede,.card.green .q{color:#fff}
p{margin-bottom:8px}
.small{font-size:13.5px;color:var(--soft)}
.q{font-family:'Lora',serif;font-style:italic;font-size:16px;line-height:1.55}
.cite{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brasstext);margin-top:6px;font-weight:500}
.card.green .cite{color:#E2CFA9}
.ar{font-family:'Amiri Quran',serif;font-size:24px;line-height:2.1;direction:rtl;text-align:right;color:var(--green);margin-bottom:4px}
.card.green .ar{color:#fff}
.btn{background:var(--green);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:500}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.brass{background:var(--brass)}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
textarea,input[type=text],input[type=date],select{width:100%;font-family:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink);margin:6px 0 10px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
textarea:focus,input:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:transparent}
label.l{display:block;font-weight:500;font-size:15px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14.5px;color:var(--ink)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.list .item{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.list .item:first-child{border-top:none}
.list .meta{font-size:12px;color:var(--stone);letter-spacing:.04em}
.del{background:none;border:none;color:var(--stone);font-size:20px;line-height:1;padding:2px 6px}
.empty{font-family:'Lora',serif;font-style:italic;color:var(--stone);text-align:center;padding:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--stone);padding:4px 6px;min-width:52px}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--green);font-weight:600}
.seg{display:flex;background:#EFE9DF;border-radius:12px;padding:4px;gap:4px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;border:none;background:none;padding:9px 10px;border-radius:9px;font-size:14px;color:var(--soft);white-space:nowrap}
.seg button.on{background:#fff;color:var(--green);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
details.sec{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.sec summary{list-style:none;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .n{font-size:12px;color:var(--brasstext);font-weight:500}
details.sec .body{padding:0 16px 14px}
.prog{height:6px;background:#EFE9DF;border-radius:6px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--brass)}
.check{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid #F1ECE3;font-size:15px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--green);flex:none}
.result{border-left:3px solid var(--brass);background:#FBF8F2;padding:12px 14px;border-radius:0 12px 12px 0;margin-top:10px;font-size:15px}
.datecard{display:flex;gap:14px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.datecard:first-child{border-top:none}
.datebadge{flex:none;width:58px;text-align:center;background:#FBF8F2;border:1px solid var(--line);border-radius:12px;padding:6px 4px}
.datebadge b{display:block;font-family:'Cormorant',serif;font-size:24px;color:var(--green);line-height:1}
.datebadge span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--brasstext)}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:#F3E9D6;color:var(--brasstext);border-radius:6px;padding:2px 7px;margin-left:6px;font-weight:600}
/* wave overlay */
.overlay{position:fixed;inset:0;background:var(--green);color:#fff;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(24px + env(safe-area-inset-top)) 22px 30px;overflow:auto;text-align:center}
.overlay.show{display:flex}
.overlay .close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:999px;padding:8px 14px;font-size:14px}
.breath{width:190px;height:190px;border-radius:50%;border:1.5px solid #E2CFA9;display:flex;align-items:center;justify-content:center;margin:28px auto 16px;position:relative}
.breath i{position:absolute;inset:0;margin:auto;width:70px;height:70px;border-radius:50%;background:rgba(226,207,169,.35);transition:all 4s ease-in-out}
.breath span{position:relative;font-family:'Cormorant',serif;font-size:26px}
.ground{max-width:420px;margin:10px auto;font-size:17px}
.ground .big{font-family:'Cormorant',serif;font-size:56px;line-height:1;color:#E2CFA9}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}

  items.forEach(it=>{const end=new Date(it.d.getTime()+864e5);
    lines.push('BEGIN:VEVENT','UID:'+it.key+'-'+uid()+'@tearsaremercy','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+icsDate(it.d),'DTEND;VALUE=DATE:'+icsDate(end),
      'SUMMARY:'+it.t.replace(/[,;\\]/g,' '),
      'DESCRIPTION:A hard date may be coming. Be gentle with yourself. Open your Tears Are Mercy app to see your plan for this day. Hijri dates are approximate.',

      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:A hard date is tomorrow','TRIGGER:-P1D','END:VALARM','END:VEVENT')});
  lines.push('END:VCALENDAR');return lines.join('\r\n')}
function downloadICS(which){const all=upcoming();const items=which==='all'?all:all.filter(i=>i.key===which);if(!items.length)return;

    <div class="chips">${['mostly with my grief','mostly with my life','a bit of both'].map(g=>`<button class="chip ${window._gl===g?'on':''}" onclick="window._gl='${g}';render()">${g}</button>`).join('')}</div>

function pattern(){
  if(S.checkins.length<2)return '';
  const t=todayUTC(), cells=[];
  for(let i=27;i>=0;i--){const d=new Date(t.getTime()-i*864e5);const ds=d.toISOString().slice(0,10);
    const c=S.checkins.filter(x=>{const n=new Date(x.date);return utc(n.getFullYear(),n.getMonth(),n.getDate()).toISOString().slice(0,10)===ds}).pop();
    cells.push(`<div class="${c?WCLASS[c.word]||'':''}" title="${ds}">${d.getUTCDate()}</div>`)}
  return `<h3>Your last four weeks</h3><div class="card"><div class="dots28">${cells.join('')}</div>
  <div class="legend"><span><i style="background:#2F4A40"></i>sharp, heavy</span><span><i style="background:#A8865A"></i>in waves</span><span><i style="background:#9AA59F"></i>numb</span><span><i style="background:#B9C7BF"></i>quiet, barely there</span></div>
  <p class="small" style="margin-top:8px">This isn't a score, and there's no streak to keep. It's just a way to notice how grief moves for you over time.</p></div>`}

  <div class="row" style="margin-top:8px"><button class="btn sm" onclick="shareMsg()">Share</button><button class="btn sm ghost" onclick="copyMsg()">Copy</button></div></div>
  <h3>When they said "just have sabr"</h3>
  <div class="card"><p class="small">People usually mean well. You don't owe anyone a lecture, and you don't have to swallow it in silence either.</p><table class="replies">${REPLIES.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</table></div>`;
  return `<h2>When grief needs more support</h2><p class="lede">Seeing a counsellor isn't a lack of faith. It's taking the means.</p>${sg}
  <div class="card"><p class="small">Most grief slowly becomes easier to carry. For some people (an estimated 4 to 15% of bereaved adults), it stays intense. Consider a counsellor or doctor if, around a year after the loss, you still notice things like:</p>
  <ul class="dots small"><li>feeling as though part of you died with them</li><li>still struggling to believe they're gone</li><li>avoiding anything that reminds you that they died</li><li>intense pain, anger or bitterness, nearly every day</li><li>finding it very hard to get back into your life</li><li>feeling numb, or that life has no meaning without them</li><li>intense loneliness</li></ul>
  <div class="result"><b>Don't wait a year if</b> you're struggling to get through each day, or having thoughts of harming yourself. Contact a doctor, a local crisis line, or emergency services now.</div>
  <p class="small" style="margin-top:8px">For awareness only, not a diagnosis. Source: American Psychiatric Association.</p></div>`}
function addPerson(){const n=document.getElementById('pName').value.trim(),p=document.getElementById('pPhone').value.trim();if(!n||!p){toast('Add a name and a number');return}S.people.push({id:uid(),name:n,phone:p.replace(/[^\d+]/g,'')});save();toast('Added');render()}
function copyMsg(){const t=document.getElementById('msgT').textContent;try{navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Select and copy the text instead'))}catch(e){toast('Select and copy the text instead')}}
function shareMsg(){const t=document.getElementById('msgT').textContent;if(navigator.share){navigator.share({text:t}).catch(()=>{})}else copyMsg()}

/* ================= More ================= */
function vMore(){
  const st=S.settings;
  return `<h2>Settings and backup</h2>
  <h3>Comfort</h3>
  <div class="card"><div class="row" style="justify-content:space-between"><span><b>Night mode</b><br><span class="small">Softer on the eyes late at night</span></span><button class="btn sm ${st.night?'':'ghost'}" onclick="S.settings.night=!S.settings.night;save();render()">${st.night?'On':'Off'}</button></div>
  <div style="margin-top:14px"><b>Text size</b><div class="chips">${[[0.92,'Smaller'],[1,'Normal'],[1.12,'Larger'],[1.25,'Largest']].map(([v,l])=>`<button class="chip ${st.scale==v?'on':''}" onclick="S.settings.scale=${v};save();render()">${l}</button>`).join('')}</div></div></div>
  <h3>Privacy</h3>
  <div class="card"><b>PIN lock</b><p class="small">Asks for a PIN when the app opens, so someone picking up your phone doesn't see what you've written. This is a privacy screen, not encryption. If you forget your PIN, the only way in is to erase everything, so keep a backup.</p>
  ${st.pin?`<button class="btn sm ghost" onclick="S.settings.pin='';save();toast('PIN removed');render()">Remove PIN</button>`:`<input type="password" id="pin1" inputmode="numeric" maxlength="8" placeholder="Choose a 4 to 8 digit PIN"><button class="btn sm" onclick="setPin()">Set PIN</button>`}</div>
  <h3>Your writing</h3>
  <div class="card"><b>Keepsake copy</b><p class="small">Print everything you've written, or save it as a PDF: your answers, letters, memories, du'as and sadaqah log.</p><button class="btn sm" onclick="printKeepsake()">Print or save as PDF</button></div>
  <div class="card"><b>Back up your entries</b><p class="small">Everything you write lives only on this device and browser. Clearing your browser or switching phones will erase it, so download a backup now and then.</p>
  <div class="row"><button class="btn sm" onclick="backup()">Download backup</button><label class="btn sm ghost" style="display:inline-block">Restore from backup<input type="file" accept="application/json,.json" style="display:none" onchange="restore(event)"></label></div>
  ${S.lastBackup?`<p class="small" style="margin:8px 0 0">Last backup: ${fmt(S.lastBackup)}</p>`:''}</div>
  <div class="card"><b>Keep it on your home screen</b><p class="small">Your app lives at <b>the-steady-shelf.github.io/tears-are-mercy</b><br><b>iPhone:</b> open that link in Safari, tap Share, then "Add to Home Screen".<br><b>Android:</b> open it in Chrome, tap the ⋮ menu, then "Add to Home screen" or "Install app".<br>Once added, it opens like an app. It needs internet to open; for fully offline use, open the offline copy from your extras zip. Your writing stays in the browser you use, so keep using the same one.</p></div>
  <h3>About</h3>
  <div class="card"><p class="small">The companion to the <i>Tears Are Mercy</i> printable journal. Created by The Steady Shelf. Written with a background in counselling psychology.</p>
  <p class="small">This app is a space to grieve, not therapy, a cure, or a religious ruling. For questions of fiqh, please ask a scholar you trust.</p>
  <p class="small">Quran: Arabic text from the King Fahd Complex (via The Noble Qur'an Encyclopedia); English, Sahih International. Hadith: English translations as published on sunnah.com. Grief information: NHS; American Psychiatric Association; Stroebe &amp; Schut (1999). This app shows verses of the Quran; please treat them with respect.</p></div>
  <div class="card"><b>Start fresh</b><p class="small">Permanently delete everything you've written in this app on this device.</p><button class="btn sm ghost" onclick="wipe()">Delete all my entries</button></div>
  <p class="foot">Tears Are Mercy · by The Steady Shelf<br>© 2026 The Steady Shelf. For personal use only.</p>`}
function setPin(){const p=document.getElementById('pin1').value.trim();if(!/^\d{4,8}$/.test(p)){toast('Use 4 to 8 digits');return}S.settings.pin=hashPin(p);save();toast('PIN set');render()}
function backup(){try{S.lastBackup=new Date().toISOString();save();const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tears-are-mercy-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded');render()}catch(e){toast('Couldn\'t create a backup on this device')}}
function restore(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);S=Object.assign(seed(),d);S.settings=Object.assign(seed().settings,d.settings||{});save();toast('Restored');render()}catch(e){toast('That file couldn\'t be read as a backup')}};r.readAsText(f)}
function wipe(){if(window._wipeArm){const keep={welcomed:true};S=seed();Object.assign(S.settings,keep);save();window._wipeArm=false;toast('All entries deleted');render()}else{window._wipeArm=true;toast('Tap again within 5 seconds to confirm');setTimeout(()=>window._wipeArm=false,5000)}}
function printKeepsake(){
  const parts=[`<h1>Tears Are Mercy</h1><p class="pm">My writing · printed ${fmt(new Date())}</p>`];
  SECTIONS.forEach(sec=>{const a=sec.p.filter(([id])=>(S.answers[id]||'').trim());if(!a.length)return;parts.push(`<h2>${esc(sec.t)}</h2>`+a.map(([id,t])=>`<div class="pq">${esc(t)}</div><div class="pa">${esc(S.answers[id])}</div>`).join(''))});
  [['letters','Letters'],['memories','Memories'],['duas',"My du'a for them"],['sadaqah','Sadaqah jariyah'],['visits','Grave visits']].forEach(([k,t])=>{if(!S[k].length)return;parts.push(`<h2>${t}</h2>`+S[k].map(x=>`<div class="pm">${fmt(x.date)}${x.extra?' · '+esc(x.extra):''}</div><div class="pa">${esc(x.text)}</div>`).join(''))});
  if(parts.length===1){toast('Nothing written yet');return}
  document.getElementById('printArea').innerHTML=parts.join('');window.print()}

/* ================= wave overlay ================= */
let breathTimer=null,groundStep=0,dhikrN=0,dhikrW=0;
const GROUND=[[5,'things you can see'],[4,'things you can touch'],[3,'things you can hear'],[2,'things you can smell'],[1,'thing you can taste']];
function peopleRow(){return S.people.length?`<div style="margin-top:22px"><div class="cite" style="color:#E2CFA9">Reach someone</div><div class="row" style="justify-content:center;margin-top:8px">${S.people.slice(0,3).map(p=>`<a class="btn ghost" style="color:#fff;border-color:#fff;text-decoration:none" href="tel:${esc(p.phone)}">Call ${esc(p.name)}</a>`).join('')}</div></div>`:`<p class="small" style="color:#E2CFA9;margin-top:22px">Tip: add trusted people in Toolkit → My people, and they'll appear here.</p>`}
function openWave(mode){
  const o=document.getElementById('wave');o.classList.add('show');document.body.style.overflow='hidden';
  mode=mode||'start';const v=VERSES[2];let inner='';
  if(mode==='start') inner=`<div class="cite" style="color:#E2CFA9">You're okay. This will pass.</div><h2 style="color:#fff;margin-top:8px">Let's slow down together</h2>
    <p style="max-width:420px;margin:8px auto 18px;opacity:.9">A wave doesn't erase the ground you've covered. It means something reached the part of you that still loves them.</p>
    <div class="row" style="justify-content:center"><button class="btn brass" onclick="openWave('breath')">Breathe with me</button><button class="btn ghost" style="color:#fff;border-color:#fff" onclick="openWave('ground')">Ground me</button><button class="btn ghost" style="color:#fff;border-color:#fff" onclick="openWave('dhikr')">Dhikr</button></div>
    ${peopleRow()}
    <div class="card green" style="max-width:460px;margin:26px auto 0;border-color:rgba(255,255,255,.25)"><div class="ar" lang="ar" dir="rtl">${v.ar}</div><div class="q">${v.en}</div><div class="cite">${v.c}</div></div>`;
  if(mode==='breath') inner=`<h2 style="color:#fff">Breathe with me</h2><p style="opacity:.9">In for 4, out for 6. Pair it with dhikr if you like.</p><div class="breath"><i id="bi"></i><span id="bt">Ready</span></div><p id="bc" style="opacity:.8">Follow the circle</p><div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" style="color:#fff;border-color:#fff" onclick="openWave('ground')">Try grounding</button><button class="btn ghost" style="color:#fff;border-color:#fff" onclick="openWave('start')">Back</button></div>`;
  if(mode==='ground'){groundStep=0;inner=`<h2 style="color:#fff">5-4-3-2-1</h2><div class="ground" id="gr"></div><button class="btn brass" id="gnext" onclick="nextGround()">Done, next</button>`}
  if(mode==='dhikr'){dhikrN=0;inner=`<h2 style="color:#fff">Dhikr</h2><div class="chips" style="justify-content:center">${DHIKR.map((d,i)=>`<button class="chip ${dhikrW===i?'on':''}" style="${dhikrW===i?'background:#A8865A;border-color:#A8865A':'background:transparent;color:#fff;border-color:rgba(255,255,255,.5)'}" onclick="dhikrW=${i};openWave('dhikr')">${d}</button>`).join('')}</div>
    <button class="tasbih" style="background:#3F5F52" onclick="tapDhikr()"><span id="dw">${DHIKR[dhikrW]}</span><b id="dn">0</b><span>tap to count</span></button><p id="dmsg" style="opacity:.8;min-height:1.5em"></p><button class="btn ghost" style="color:#fff;border-color:#fff" onclick="openWave('start')">Back</button>`}
  o.innerHTML=`<button class="close" onclick="closeWave()">Close</button>`+inner;
  if(mode==='breath')startBreath();else stopBreath();
  if(mode==='ground')drawGround();
}
function tapDhikr(){dhikrN++;document.getElementById('dn').textContent=dhikrN;if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){};if(dhikrN%33===0){document.getElementById('dmsg').textContent=dhikrN+'. Take a slow breath.';if(navigator.vibrate)try{navigator.vibrate([30,60,30])}catch(e){}}}
function closeWave(){stopBreath();const o=document.getElementById('wave');o.classList.remove('show');o.innerHTML='';document.body.style.overflow=''}
function startBreath(){stopBreath();let phase=0,count=0;const bi=()=>document.getElementById('bi'),bt=()=>document.getElementById('bt'),bc=()=>document.getElementById('bc');
  const step=()=>{if(!bi())return stopBreath();
    if(phase===0){bi().style.transition='all 4s ease-in-out';bi().style.width='180px';bi().style.height='180px';bt().textContent='Breathe in';phase=1;breathTimer=setTimeout(step,4000)}
    else{bi().style.transition='all 6s ease-in-out';bi().style.width='70px';bi().style.height='70px';bt().textContent='Breathe out';phase=0;count++;bc().textContent=count+(count===1?' breath':' breaths');breathTimer=setTimeout(step,6000)}};
  breathTimer=setTimeout(step,600)}
function stopBreath(){clearTimeout(breathTimer);breathTimer=null}
function drawGround(){const g=document.getElementById('gr');if(!g)return;if(groundStep>=GROUND.length){g.innerHTML=`<p style="font-size:19px;margin-top:20px">Well done. You're here, in this moment.</p><p style="opacity:.85">Take one slow breath. Alhamdulillah.</p>`;document.getElementById('gnext').textContent='Close';document.getElementById('gnext').onclick=closeWave;return}
  const [n,t]=GROUND[groundStep];g.innerHTML=`<div class="big">${n}</div><p style="font-size:19px">Name ${n} ${t}.</p><p style="opacity:.8;font-size:15px">Say them quietly, or in your head. Take your time.</p>`}
function nextGround(){groundStep++;drawGround()}

/* ================= welcome + lock ================= */
function showWelcome(){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="welcome"><div class="in">
   <div class="cite">Assalamu alaikum</div><h2 style="font-size:32px">Welcome. We're so sorry for your loss.</h2>
   <p class="lede" style="margin-top:8px">This app sits alongside your <i>Tears Are Mercy</i> journal. Open it whenever you need it, for a minute or an hour.</p>
   <div class="card"><ul class="dots"><li><b>Today:</b> a gentle check-in and a word for the day</li><li><b>Reflect:</b> readings, the journal prompts, letters and memories</li><li><b>Du'a:</b> du'a and verses in Arabic and English, plus your sadaqah log</li><li><b>Dates:</b> Ramadan and Eid worked out for you, with gentle calendar reminders</li><li><b>Toolkit:</b> help for the moment a wave hits</li></ul></div>
   <div class="card tint"><b>It's private.</b><p class="small" style="margin:4px 0 0">No account, no internet needed. Everything stays on this device. You can add a PIN in More.</p></div>
   <button class="btn block" onclick="finishWelcome()">Begin</button>
   <p class="small" style="text-align:center;margin-top:12px">This app is a space to grieve, not therapy or a religious ruling.</p>
  </div></div>`}
function finishWelcome(){S.settings.welcomed=true;save();document.getElementById('modal').innerHTML='';render()}
function showLock(){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="lock"><div class="k" style="font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#E2CFA9">Tears Are Mercy</div><h2 style="color:#fff;margin:6px 0 14px">Enter your PIN</h2>
  <input type="password" id="pinIn" inputmode="numeric" maxlength="8" autofocus onkeyup="if(event.key==='Enter')tryPin()"><button class="btn brass" style="margin-top:6px" onclick="tryPin()">Open</button>
  <button style="background:none;border:none;color:#E2CFA9;margin-top:22px;font-size:14px" onclick="forgotPin()">Forgot PIN?</button></div>`;
  setTimeout(()=>{const i=document.getElementById('pinIn');if(i)i.focus()},50)}
function tryPin(){const p=document.getElementById('pinIn').value;if(hashPin(p)===S.settings.pin){document.getElementById('modal').innerHTML='';render()}else{toast('That PIN didn\'t match');document.getElementById('pinIn').value=''}}
function forgotPin(){if(window._fArm){S=seed();S.settings.welcomed=true;save();window._fArm=false;document.getElementById('modal').innerHTML='';toast('Everything was erased. You can restore a backup in More.');render()}else{window._fArm=true;toast('This erases everything in the app. Tap "Forgot PIN?" again to confirm.');setTimeout(()=>window._fArm=false,6000)}}


applySettings();
if(S.settings.pin){showLock()}else{render();if(!S.settings.welcomed)showWelcome()}
</script>
</body></html>
